name: health_score_hourly_sync

on:
  schedule:
    # Roda todo início de hora (08:00, 09:00, etc.)
    - cron: '0 * * * *'
  workflow_dispatch:
    # Permite que você rode manualmente clicando num botão no GitHub

jobs:
  build_and_run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Criar credenciais.json
        # Esse passo transforma o seu Secret do GitHub no arquivo que o gspread precisa
        run: echo "${{ secrets.GOOGLE_CREDS_JSON }}" > credenciais.json

      - name: Rodar Pipeline
        env:
          METABASE_URL: ${{ secrets.METABASE_URL }}
          METABASE_API_KEY: ${{ secrets.METABASE_API_KEY }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: python main.py